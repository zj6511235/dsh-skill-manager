name: validate

on:
  push:
  pull_request:

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate package.json and bundle patch
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));if(!p.name)throw new Error('name is required');if(!p.version)throw new Error('version is required');const patch=p.dsh&&p.dsh.bundle&&p.dsh.bundle.patch;if(patch&&!fs.existsSync(patch))throw new Error('bundle patch missing: '+patch);console.log('ok',p.name,p.version)"
